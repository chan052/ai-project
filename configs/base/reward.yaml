reward_horizon: 10

use_path: true
use_utility: true
use_mae: true

path:
  gamma: 0.75  # decay rate r for Path weights w_k ∝ r^(k-1)
  per_step_return_mode: simple
  normalization: null  # TBD — not implemented

utility:
  alpha: 1.0
  beta: 2.0
  lambda: 1.5

mae:
  normalization: null  # TBD — not implemented

# Legacy / P2 — not used in P1 F-target engine
use_surprise: false
use_hold_neutral_path: false
use_hold_movement: false
use_hold_surprise: false
