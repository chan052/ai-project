[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chartai"
version = "0.1.0"
description = "Chart Intelligence AI — P1 research RL system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chartai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
